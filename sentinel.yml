name: Tiger Sentinel Autonomous Scan
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Tiger Sentinel
        run: python bot.py
        timeout-minutes: 10

      - name: Commit findings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tiger-sentinel-findings.json sentinel-state.json || true
          git diff --staged --quiet || git commit -m "Tiger Sentinel: new findings"
          git push
