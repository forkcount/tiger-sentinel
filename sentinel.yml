name: Tiger Sentinel Full Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run full scan
        run: python bot.py
      - name: Commit findings
        if: always()
        run: |
          git config user.name "tiger-sentinel"
          git config user.email "sentinel@users.noreply.github.com"
          git add sentinel_state.json findings_*.json || true
          git diff --staged --quiet || git commit -m "sentinel: full scan $(date -u +%Y-%m-%d)"
          git push || echo "push failed"
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: findings-${{ github.run_number }}
          path: findings_*.json
          retention-days: 30
